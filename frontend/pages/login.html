<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/frontend/css/global.css">
    <link rel="stylesheet" href="/frontend/css/login.css">
</head>
<body>
    <div class="container">
    
            <div class="left-side">
                <div class="content">
                    <p>Please login to continue.</p>
                    
                </div>
            </div>
            <div class="right-side">
                <h1>TestYourCode</h1>
                
                <form action="/login">
                    <label class="form-label" for="email">Email:</label>
                    <input type="email" id="email" name="email"  class="form-input" placeholder="user@gmail.com" required>
                    <br>
                    <label class="form-label" for="password">Password:</label>
                    <input type="password" id="password" class="form-input" name="password" required  maxlength="6" placeholder="!#@$#%$^$">
                
                    <a class="link" href="signup.html">Create Account</a>
                    <button id="login" type="submit">Login</button>
                </form>
            </div>
    </div>
    <script src="/frontend/js/index.js"></script>
</body>
</html>
