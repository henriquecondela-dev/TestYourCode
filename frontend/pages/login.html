<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/frontend/css/global.css">
    <link rel="stylesheet" href="/frontend/css/login.css">
    <link rel="stylesheet" href="/frontend/css/smalldevices.css">
    <link rel="stylesheet" href="/frontend/css/messegesAlert.css">
</head>
<body>
       <div class="container">      
            <div class="left-side">
                <div class="content">
                    <p>Please login to continue.</p>
                </div>
            </div>
            <div class="right-side">
                <div id="login-error-message"></div>
                <h1>TestYourCode</h1>
                <div id="loginmessage"></div>
                <form novalidate id="login-form" >
                    <label class="form-label" for="email">Email:</label>
                    <input type="email" id="email" name="email"  class="form-input" placeholder="user@gmail.com">
                    <small class="form-error" id="email-error"></small>
                   
                    <label class="form-label" for="password">Password:</label>
                    <input type="password" id="password" class="form-input" name="password"  >
                    <small class="form-error" id="password-error"></small>
               
                    <a class="link" href="signup.html">Don't Have Account? <b>Create</b></a>
                    <button id="login" type="submit">Login</button>
                </form>
            </div>
    </div>
    <script type="module" src="/frontend/js/messagesAlert.js"></script>
    <script type="module" src="/frontend/js/login.js"></script>
</body>
</html>
