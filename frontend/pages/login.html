<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">
    <title>Login</title>
    <link rel="stylesheet" href="/frontend/css/global.css">
    <link rel="stylesheet" href="/frontend/css/login.css">
    <link rel="stylesheet" href="/frontend/css/smalldevices.css">
    <link rel="stylesheet" href="/frontend/css/messegesAlert.css">
</head>
<body>
       <div class="container">      
            <div class="left-side">
                <div class="content">
                    <p>Please login to continue.</p>
                </div>
            </div>
            <div class="right-side">
                <div id="login-error-message"></div>
                <h1>TestYourCode</h1>
                <div id="loginmessage"></div>
                <form novalidate id="login-form" >
                    <label class="form-label" for="email">Email:</label>
                    <input type="email" id="email" name="email"  class="form-input" placeholder="user@gmail.com">
                    <small class="form-error" id="email-error"></small>
                   
                    <label class="form-label" for="password">Password:</label>
                    <div class="password-box">
                        <input type="password" id="password" class="form-input" name="password"  >
                        <button type="button" class="show-password" data-target="password">Show</button>
                    </div>
                    <small class="form-error" id="password-error"></small>
               
                   
                    <button id="login" type="submit">
                        <img id="spinner-icon" src="/assets/images/spinner_barras (1).png" alt="Loading...">
                        <span id="login-text">Login</span>
                    </button>
                </form>
                 <a class="link" href="signup.html">Don't have an account? <b>Create</b></a>
            </div>
    </div>
    <script type="module" src="/frontend/js/messagesAlert.js"></script>
    <script type="module" src="/frontend/js/login.js"></script>
    <script src="/frontend/js/showPassword.js"></script>
</body>
</html>
