<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">
        <title>Results</title>
        <link rel="stylesheet" href="/frontend/css/global.css">
        <link rel="stylesheet" href="../css/results.css">
    </head>
    <body>
        <header class="header" id="header">
            <div classs="content" id="content"><button id="groups-btn"><img src="/assets/images/menu-burger.png" alt=""></button><span class="logo">Rank</span></div>
            <div class="logo-name" id="logo-name">TestYourCode</div>
            <div class="user" >
                <span class="mini-avatar" id="mini-avatar"></span>
                <div id="userName"></div></div>
            </div>
        </header>
        <div class="down-side">
            <div class="nav-bar" id="nav-bar">
                <h1>Groups</h1>
                <div class="groups-container" id="groups-container">
                </div>
            </div>
            <div class="rigth-side">
                <div class="best-ranking">
                    <div class="rank" id="rank_2">
                        <div class="position" id="second-position">2<small><sup>nd</sup></small></div><span class="rank-avatar" id="second-avatar"></span>
                        <div class="name" id="second-name"></div>
                        <div class="score" id="second-score"></div>
                    </div>
                    <div class="rank" id="rank_1">
                        <div class="position" id="first-position">1<small><sup>st</sup></small></div><span class="rank-avatar" id="first-avatar"></span>
                        <div class="name" id="first-name"></div>
                        <div class="score" id="first-score"></div>
                    </div>
                    <div class="rank" id="rank_3">
                        <div class="position" id="third-position">3<small><sup>rd</sup></small></div>
                        <span class="rank-avatar" id="third-avatar"></span>
                        <div class="name" id="third-name"></div>
                        
                        <div class="score" id="third-score"></div>
                    </div>
                </div>
                <div class="ranking-container" id="ranking-container">
                </div>
            </div>
        </div>
        <script type="module" src="../js/results.js"></script>
    </body>
</html>
