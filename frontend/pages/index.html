<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/css/index.css">
    <link rel="stylesheet" href="/frontend/css/messegesAlert.css">
    
    <title>index</title>
</head>
<body>
    <div class="topNavBar">
        <p class="top" id="logo"></p>
        <h1 class="top" id="name">TestYourCode</h1>
        <p class="top" id="userName"><img src="/assets/images/user.png" alt=""></p>
    </div>
    <div class="message-box"></div>
    <div class="downPage">
        <div class="left-side">
            <button type="button" id="state-btn"><img src="/assets/images/angle-left.png" alt="#"></button>
            <a class="link" href="dashboard.html">
                <span class="icon"><img src="/assets/images/menu.png" alt="menu"></span>
                <span class="text">Dashboard</span>
            </a>
            <a class="link" href="historie.html">
                <span class="icon"><img src="/assets/images/history.png" alt="historie"></span>
                <span class="text">Historics</span>
            </a>

            <a class="link" href="Settings.html">
                <span class="icon"><img src="/assets/images/settings.png" alt="settings"></span>
                <span class="text">Settings</span>
            </a>

            <a class="link" href="chat.html">
                <span class="icon"><img src="/assets/images/comment.png" alt="chating"></span>
                <span class="text">Chat</span>  
            </a>

            <a id="logout" class="link" href="login.html">
                <span class="icon"><img src="/assets/images/exit(1).png" alt=""></span>
                <span class="text">LogOut</span> 
            </a>
        </div>
        <div class="right-side">
            <div class="top-right-side">
                <button type="button" class="btn" id="creatGrup-btn">Creat a Group challenge</button>
                <div id="creat-overlay">
                    <div id="creat-modal">
                        <div class="message-box"></div>
                        <h2>Creat Group challenge</h2>
                        <form class="form" novalidate>
                            <label class="link" for="name">Name:</label>
                            <input class="form-input"  id="creatGroup-name" type="text">
                            <label class="link" for="language">Language</label>
                            <select class="form-input"  name="payment" id="payment">
                                <option value="Java">Java</option>
                                <option value="javaScript">JavaScript</option>
                                <option value="python">Phyton</option>
                                <option value="paypal">C++</option>
                                <option value="c">C</option>
                                <option value="c#">C#</option>
                            </select>
                            <div class="low-bar">
                                <button class="btn" id="creatgroup-btn" type="submit">Creat</button>
                                <button type="button" class="btn" id="creat-cancel-btn">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
                <button class="btn" id="joinGroup-btn">Join in a group challenge</button>
                    <div id="join-overlay">
                        <div id="join-modal">
                            <div id="joinMessage"></div>
                            <h2>Available Groups</h2>
                            <div id="groups-container">
                            </div>
                            <div class="modal-buttons">
                                <button type="button"   class="btn"           id="join-selected-btn">Join</button>
                                <button type="button" class="btn" id="join-cancel-btn">Cancel</button>
                            </div>
                        </div>
                    </div>
                 <button type="button" class="btn" id="startGroup-btn">Start a challenge</button>
                    <div id="start-overlay">
                        <div id="start-modal">
                            <div id="startMessage"></div>
                            <h2>Your Groups</h2>
                            <div id="owner-groups-container">
                            </div>
                            <div class="modal-buttons">
                                <button type="button"   class="btn"           id="start-selected-btn">Start</button>
                                <button type="button" class="btn" id="start-cancel-btn">Cancel</button>
                            </div>
                        </div>
                    </div>
            </div>
            <div id="terminal">
                  <div id="terminal-settings">
                    <div class="left-seting">
                        <span class="dot"><img src="/assets/images/icons8-red-circle-50.png" alt="dot red"></span>
                        <span class="dot"><img src="/assets/images/icons8-yellow-circle-50.png" alt="dot yellow"></span>
                        <span class="dot"><img src="/assets/images/icons8-green-circle-50.png" alt="dot green"></span>
                    </div>
                    <span id="file-name">main.java</span>
                </div>
                <p id="text"></p>
            </div>
        </div>
    </div>
    <script src="/frontend/js/challenge.js"></script>
    <script src="/frontend/js/index.js"></script>
    <script src="/frontend/js/terminal.js"></script>
    <script src="/frontend/js/messagesAlert.js"></script>
</body>
</html>
