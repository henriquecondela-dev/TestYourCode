<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/css/index.css">
    <link rel="stylesheet" href="/frontend/css/messegesAlert.css">
    <title>index</title>
</head>
<body>
    <div class="topNavBar">
        <p class="top" id="logo"></p>
        <h1 class="top" id="name">TestYourCode</h1>
        <p class="top" ><img src="/assets/images/user.png" alt=""><span id="userName"></span></p>
    </div>
    <div class="downPage">
        <div class="left-side">
            <button type="button" id="state-btn"><img src="/assets/images/angle-left.png" alt="#"></button>
           
            <a class="link" href="historie.html">
                <span class="icon"><img src="/assets/images/history.png" alt="historie"></span>
                <span class="text">Historics</span>
            </a>

            <a class="link" href="Settings.html">
                <span class="icon"><img src="/assets/images/settings.png" alt="settings"></span>
                <span class="text">Settings</span>
            </a>

            <a class="link" href="chat.html"> 
                <span class="icon"><img src="/assets/images/comment.png" alt="chating"></span>
                <span class="text">Chat</span>  
            </a>

            <a id="logout" class="link" href="login.html">
                <span class="icon"><img src="/assets/images/exit(1).png" alt=""></span>
                <span class="text">LogOut</span> 
            </a>
        </div>
        <div class="right-side">
            <div id="message-box"></div>
            <div class="top-right-side">
                <button type="button" class="btn" id="creatGrup-btn">Creat a Group challenge</button>
                <div id="creat-overlay">
                    <div id="message-box-create"></div>
                    <div id="creat-modal">
                        <h2 class="headLink">Creat Group challenge</h2>
                        <div>
                            <label class="link" for="name">Name:</label>
                            <input class="form-input"  id="creatGroup-name" type="text">
                        </div>                      
                        <div class="modal-buttons">
                                <button class="btn" id="creatgroup-btn" type="submit">Creat</button>
                                <button type="button" class="btn" id="creat-cancel-btn">Cancel</button>
                        </div>
                    </div>
                </div>
                <button class="btn" id="joinGroup-btn">Join in a group challenge</button>
                    <div id="join-overlay">
                        <div id="joinMessage"></div>
                        <div id="join-modal">
                             <div class="cancelModel"><button type="button" class="btn" id="join-cancel-btn1">X</button></div>
                            <h2 class="headLink">Available Groups</h2>
                            <div id="groups-container">
                            </div>
                            <div class="modal-buttons">
                                <button type="button" class="btn" id="join-selected-btn">Join</button>
                                <button type="button" class="btn" id="join-in-challenge">Participate</button>
                                <button type="button" class="btn" id="go-in-chalenge-btn">Go</button>
                            </div>
                        </div>
                    </div>
                    <div id="wait-overlay">
                        <button type="button" class="btn" id="getOut-btn">Get Out</button>
                        <h2 id="wait-title">Waiting for the owner to start...</h2>
                        <div class="wait-modal">
                            <div id="wait-timer">00:00:00</div>
                            <div class="wait-participants-card">
                                <h2>Participants:</h2>
                                <div id="wait-participants-container">
                                </div>
                            </div>
                        </div>
                    </div>
                <button type="button" class="btn" id="startGroup-btn">Start a challenge</button>
                    <div id="start-overlay">
                         <div id="startMessageAlert"></div>
                        <div id="start-modal">
                            <div class="cancelModel"><button type="button" class="btn" id="start-cancel-btn1">X</button></div>
                            <h2 class="headLink">Your Groups</h2>
                            <div id="owner-groups-container">
                            </div>
                            <div class="modal-buttons">
                                <button type="button" class="btn" id="next1-btn">Next</button>
                            </div>
                        </div>
                        <div id="start-settings-modal">
                            <div class="cancelModel"><button type="button" class="btn" id="start-cancel-btn2">X</button></div>
                            <h2 class="headLink">Preferences</h2>
                            <div>
                                <label
                                class="link"
                                for="NOfPartipants">N<sup><small>o</small></sup> of Participants: </label>
                                <input type="number" value="5" id="NOfPartipants" min="2" max="8"><br>
                            </div>
                            <div>
                                <label class="link" for="DurationTime">Duration Time: </label>
                                <input type="number" class="time" id="hours" min="0" value="01"><small>h</small> :
                                <input type="number" class="time" id="minutes" min="0" value="30"><small>m</small> :
                                <input type="number" class="time" id="seconds" min="0" value="00"><small>s</small>
                            </div>
                            <div>
                                <label  class="link" for="difficulty">Difficulty Level: </label>
                                <select name="difficulty" id="difficulty">
                                    <option value="EASY">Easy</option>
                                    <option value="MEDIUM">Medium</option>
                                    <option value="HARD">Hard</option>
                                </select>
                            </div>
                            <div>
                                <label  class="link" for="category">Challenge Category: </label>
                                <select name="category" id="category">
                                    <option value="FUNDAMENTALS">Fundamentals</option>
                                    <option value="ARRAYS">Arrays</option>
                                    <option value="POO">POO</option>
                                    <option value="STRINGS">Strings</option>
                                    <option value="ALGORITHMS">Algorithms</option>
                                    <option value="PROBLEM_SOLVING">Problem Solving</option>
                                    <option value="RANDOM">Random</option>
                                </select>
                            </div>
                            <div>
                                <label class="link" for="language">Language</label>
                                <select  name="language" id="language">
                                    <option value="JAVA">Java</option>
                                    <option value="JAVASCRIPT">JavaScript</option>
                                    <option value="PHYTON">Phyton</option>
                                    <option value="CPP">C++</option>
                                    <option value="C">C</option>
                                    <option value="C_CHARP">C#</option>
                                </select>
                            </div>
                            <div id="challegeGenerator">
                                <button id="generateProblem-btn">
                                    <img id="spinner-icon" src="/assets/images/loading.png" alt="Loading...">
                                    <span id="textProblem">Generate Problem</span>
                                </button>
                            </div>
                            <div class="modal-buttons">
                                <button type="button" class="btn" id="back1-btn">Back</button>
                                <button type="button" class="btn" id="next2-btn">Next</button>
                            </div>
                        </div>

                        <div id="start-summary-modal">
                            <div class="cancelModel"><button type="button" class="btn" id="start-cancel-btn3">X</button></div>
                            <h2 class="headLink">Preferences</h2>
                            <div id="summary" style="text-align: center;font-weight: bolder;">No challenge generated yet</div>
                            <div class="modal-buttons">
                                <button type="button" class="btn" id="back2-btn">Back</button>
                                <button type="button"   class="btn" id="start-selected-btn">Start</button>
                            </div>
                        </div>
                    </div>
            </div>
            <div id="terminal">
                  <div id="terminal-settings">

                    <div class="left-seting">
                        <span class="dot"><img src="/assets/images/icons8-red-circle-50.png" alt="dot red"></span>
                        <span class="dot"><img src="/assets/images/icons8-yellow-circle-50.png" alt="dot yellow"></span>
                        <span class="dot"><img src="/assets/images/icons8-green-circle-50.png" alt="dot green"></span>
                    </div>
                    <span id="file-name">main.java</span>
                </div>
                <p id="text"></p>
            </div>
        </div>

    </div>
    <script src="/frontend/js/terminal.js"></script>
    <script type="module" src="/frontend/js/messagesAlert.js"></script>
    <script type="module" src="/frontend/js/index.js"></script>
    
</body>
</html>
