<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="/frontend/css/global.css">
    <link rel="stylesheet" href="/frontend/css/signup.css">
    <link rel="stylesheet" href="/frontend/css/smalldevices.css">
    <link rel="stylesheet" href="/frontend/css/messegesAlert.css">
</head>
<body>
    <div class="container">
            <div class="left-side">
                <div class="content">
                    <p>Register Your Self</p>
                </div>
            </div>
            <div class="right-side">
                <div id="signup-error-message"></div>
                <h1>TestYourCode</h1>
                <form novalidate id="sign-form">
                    <label class="form-label" for="username">Name<sup style="color: red;">*</sup>:</label>
                    <input type="text" id="username" name="username"  class="form-input" placeholder="username" >
                    <small class="form-error" id="username-error"></small>

                    <label class="form-label" for="sign-email">Email<sup style="color: red;">*</sup>:</label>
                    <input type="email" id="sign-email" name="email"  class="form-input" placeholder="user@gmail.com" >
                    <small class="form-error"  id="signemail-error"></small>

                    <label class="form-label" for="sign-password">Password<sup style="color: red;">*</sup>:</label>
                    <input type="password" id="sign-password" class="form-input" name="password">
                    <small class="form-error" id="signpassword-error"></small>

                    <label class="form-label" for="password-confirmation">Confirm the password<sup style="color: red;">*</sup>:</label>
                    <input type="password" id="password-confirmation" class="form-input">
                    <small class="form-error" id="confirmpassword-error"></small>
                    <a class="link" href="login.html">I hava an Account!<b>Login</b></a>
                    <button id="signup" type="submit">SignUp</button>
                </form>
           </div>
    </div>
    <script type="module" src="/frontend/js/messagesAlert.js"></script>
    <script type="module" src="/frontend/js/signup.js"></script>
</body>
</html>
